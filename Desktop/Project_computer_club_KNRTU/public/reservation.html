<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Бронирование | Vibe Gaming Club</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container header__inner">
      <h1>Vibe Gaming Club</h1>
      <a href="index.html" class="header__btn">На главную</a>
    </div>
  </header>

  <main>
    <section id="booking" class="booking">
      <div class="container">
        <div class="booking__card">
          <h3>Форма бронирования</h3>

          <form class="booking-form" id="bookingForm" action="/bookings" method="POST">
            <label for="name">Имя</label>
            <input type="text" id="name" name="name" placeholder="Ваше имя" required>

            <label for="phone">Номер телефона</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="79991234567"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="11"
              required
            >

            <label for="date">Дата</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Время</label>
            <input type="time" id="time" name="time" required>

            <label for="service">Услуга</label>
            <select id="service" name="service" required>
              <option value="">Выберите услугу</option>
              <option value="1 час">1 час</option>
              <option value="2 часа">2 часа</option>
              <option value="3 часа">3 часа</option>
              <option value="Ночь">Ночь</option>
            </select>

            <label>Пол</label>
            <div class="gender-group">
              <label class="gender-option">
                <input type="radio" name="gender" value="female" required>
                Женский
              </label>

              <label class="gender-option gender-option--disabled">
                <input type="radio" name="gender" value="male" id="maleGender" required>
                Мужской
              </label>
            </div>

            <label for="comment">Дополнительный комментарий</label>
            <textarea id="comment" name="comment" rows="5" placeholder="Например: сколько человек, есть ли пожелания"></textarea>

            <button type="submit" id="submitBtn">Отправить заявку</button>
          </form>
        </div>

        <div id="bookingList" class="booking-list"></div>
      </div>
    </section>
  </main>

  <script src="booking.js"></script>
</body>
</html>
